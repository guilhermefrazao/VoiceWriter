services:
  voicewriter:
    build:
      context: .
      dockerfile: Dockerfile
    image: voicewriter:latest
    container_name: voicewriter

    # ── Timezone e variáveis de ambiente ────────────────────────────────────────
    environment:
      - TZ=America/Sao_Paulo
      # X11: forward da janela do Flet para o X Server do Windows (VcXsrv)
      - DISPLAY=host.docker.internal:0.0
      # PulseAudio: servidor rodando no Windows (ver README — instalar PulseAudio para Windows)
      - PULSE_SERVER=tcp:host.docker.internal:4713
      # Variáveis do projeto (copie .env.example → .env e preencha)
      - HF_TOKEN=${HF_TOKEN}
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB=${MONGODB_DB:-voicewriter}
      # ── Limite de memória GPU (nível de aplicação) ───────────────────────────
      # Descomente para simular GPU com menos VRAM disponível:
      # - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:2048
      # Seleciona qual GPU usar (0 = primeira GPU do host):
      - CUDA_VISIBLE_DEVICES=0

    # ── Volumes ─────────────────────────────────────────────────────────────────
    volumes:
      # Código-fonte montado no container (edições refletem imediatamente)
      - .:/app
      # Cache de modelos HuggingFace / Whisper (evita re-download a cada run)
      - hf_cache:/root/.cache/huggingface
      # (áudio e X11 via TCP no Windows — sem volumes de socket necessários)

    # ── Recursos: CPU, RAM e GPU ─────────────────────────────────────────────────
    # Ajuste os limites abaixo para simular hardware menos potente.
    deploy:
      resources:
        limits:
          # Número de núcleos de CPU disponíveis para o container
          # Exemplos: "1.0" (1 core), "2.0" (2 cores), "4.0" (4 cores)
          cpus: "4.0"
          # Memória RAM máxima
          # Exemplos: "2G", "4G", "8G"
          memory: "8G"
        reservations:
          devices:
            - driver: nvidia
              # Quantidade de GPUs: 1 para usar apenas uma, "all" para todas
              count: 1
              capabilities: [gpu]

    # Adiciona o usuário do container ao grupo de áudio do host
    group_add:
      - audio

    # Terminal interativo (útil para logs e debugging)
    stdin_open: true
    tty: true

    # Não reinicia automaticamente (ambiente de desenvolvimento/pesquisa)
    restart: "no"

# ── Volumes nomeados ───────────────────────────────────────────────────────────
volumes:
  hf_cache:
    driver: local
