[project]
name = "voicewriter"
version = "0.1.0"
description = "Voice-driven text editor with Whisper transcription"
requires-python = ">=3.12"
dependencies = [
    "speechrecognition==3.14.5",
    "flet[all]==0.80.2",
    "pyaudio==0.2.14",
    "openai-whisper==20250625",
    "soundfile==0.13.1",
    "appopener==1.7",
    "faster-whisper==1.2.1",
    "keyboard==0.13.5",
    "send2trash==2.1.0",
    "pyperclip==1.8.2",
    "pyautogui==0.9.54",
    "pillow==11.2.1",
    "supabase>=2.0.0",
    "nltk>=3.8",
    "python-dotenv>=1.0.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "notebook>=7.0",
    "ipykernel>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Disable ROS2 pytest plugins that leak in via PYTHONPATH and are
# incompatible with modern pytest hook validation.
addopts = "-p no:launch_ros -p no:launch_testing -p no:launch_pytest"

[tool.uv]
package = false
dev-dependencies = [
    "pip",
    "pytest>=8.0",
]
override-dependencies = [
    "pywin32 ; sys_platform == 'win32'",
]
